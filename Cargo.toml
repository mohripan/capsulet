[workspace]
members = [
    "crates/application",
    "crates/api",
    "crates/cli",
    "crates/core",
    "crates/evaluator",
    "crates/graph-worker",
    "crates/ir",
    "crates/ir-adapters",
    "crates/kernel",
    "crates/observability",
    "crates/pack",
    "crates/postgres",
    "crates/proposer",
    "crates/replay",
    "crates/runner",
    "crates/runtime",
    "crates/scheduler",
    "crates/storage",
    "crates/verifier",
    "crates/worker",
    "crates/xtask",
]
resolver = "2"

# Every crate inherits these. The version and repository come from
# release.toml, and `capsulet-xtask release check` holds them to it. No crate is
# published on its own: they ship as the product's binaries and images.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mohripan/capsulet"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10.4"
cron = "0.17.0"
http-body-util = "0.1"
hmac = "0.13"
icu_casemap = "2.3"
icu_properties = "2.3"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13"
utoipa = { version = "5.5", features = ["axum_extras"] }
