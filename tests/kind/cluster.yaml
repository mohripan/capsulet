# The disposable cluster the `kind` gate creates for one run, and deletes after
# it. One node, which takes Capsulet's control plane and the `mini` execution
# pool the smoke's job runs in. The node image is the one kind v0.31.0 ships
# for Kubernetes 1.35, pinned by digest like every other image.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    labels:
      capsulet.dev/pool: mini
