version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  # The Rust images' Dockerfile. The dashboard's is the next entry; release.toml
  # names both, and there is no other.
  - package-ecosystem: docker
    directory: /crates
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
