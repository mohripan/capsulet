name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  rust-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          # gate-regressions shows the lint gate failing on a Clippy warning.
          components: clippy

      # Pinned, so a scanner release cannot change what passes without a
      # commit that says so. `verify doctor` holds a developer machine to the
      # same versions as minimums.
      - name: Install scanners
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # gate-regressions runs the dashboard's own ESLint against a crashing
      # configuration, so the dashboard's dependencies have to be installed.
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # One gate graph, so CI and a developer machine check the same things
      # against the same exceptions. Those live in docs/contracts/
      # security-exceptions.json, .cargo/audit.toml and deny.toml, each owned
      # and expiring. gate-regressions shows the lint, dashboard and security
      # gates failing on the defects they exist to catch.
      - name: Verify
        run: >
          cargo run -p capsulet-xtask --locked --
          verify --gate security --gate gate-regressions

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: crates/Dockerfile
            context: .
            build-args: |
              PACKAGE=capsulet-api
              BIN=capsulet-api
          - name: worker
            dockerfile: crates/Dockerfile
            context: .
            build-args: |
              PACKAGE=capsulet-worker
              BIN=capsulet-worker
          - name: scheduler
            dockerfile: crates/Dockerfile
            context: .
            build-args: |
              PACKAGE=capsulet-scheduler
              BIN=capsulet-scheduler
          - name: graph-worker
            dockerfile: crates/Dockerfile
            context: .
            build-args: |
              PACKAGE=capsulet-graph-worker
              BIN=capsulet-graph-worker
          - name: evaluator
            dockerfile: crates/Dockerfile
            context: .
            build-args: |
              PACKAGE=capsulet-evaluator
              BIN=capsulet-evaluator
          - name: dashboard
            dockerfile: dashboard/Dockerfile
            context: dashboard
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/capsulet-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true

      # Two scans, because reporting and gating want different thresholds.
      # This one reports everything, fixed or not, and never fails: hiding an
      # advisory nobody can fix yet would be worse than not gating on it.
      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"

      # And this one fails the build, under the checked-in policy in
      # trivy.yaml: a fixable HIGH or CRITICAL is a defect one rebuild away
      # from being gone, so it is worth stopping for.
      - name: Gate on fixable image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          trivy-config: trivy.yaml

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cyclonedx.json

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
