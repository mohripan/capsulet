name: Supply Chain

# Every image of a pull request, built and scanned without being published.
# Nothing here can push, sign or attest: the workflow holds read access and a
# code-scanning upload. On main, release.yml builds each image once, scans it
# and publishes that build, so a second build here would be a different
# artifact from the one released. Dependency policy, secret scanning and the
# third-party image scan are gates, run by ci.yml with every other gate.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The image matrix is release.toml's, through the plan the `containers`
  # gate builds too: each component's image name, Dockerfile, target and the
  # build arguments its OCI labels come from. A matrix written here would be a
  # second definition of the images that drifts from the first.
  image-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Plan the images
        id: plan
        run: echo "matrix=$(cargo run --quiet -p capsulet-xtask --locked -- release images --plan)" >> "$GITHUB_OUTPUT"

  images:
    name: image (${{ matrix.component }})
    needs: image-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/image-scan.yml
    with:
      component: ${{ matrix.component }}
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      target: ${{ matrix.target }}
      build_args: ${{ matrix.build_args }}
