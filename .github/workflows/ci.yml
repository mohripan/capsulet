name: CI

# Every job here calls `capsulet-xtask verify --gate ...`, never a hand-rolled
# command. What passes or fails is decided by repository code that a developer
# runs identically on their own machine; this file only schedules the work and
# provides the services it needs. A workflow that reimplements a check is a
# second definition of "green" that drifts from the first.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  rust:
    name: Rust and IR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify
        run: >
          cargo run -p capsulet-xtask --locked --
          verify --gate verifier --gate format --gate lint --gate unit --gate ir
          --gate replay

  contracts:
    name: Product contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Node 24 or newer: claims-evidence reads which file each dashboard test is
      # in from Node's junit reporter, which only writes it from Node 24.
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Verify
        run: >
          cargo run -p capsulet-xtask --locked --
          verify --gate claims --gate api-contracts --gate authorization --gate sdk
          --gate claims-evidence --gate release --gate supply-chain-contract

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    # No service container: the gate provisions its own isolated database and
    # tears it down, so the same command runs here and on a laptop. A service
    # container would be a second, differently configured database that only CI
    # ever sees.
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # These gates fail when any database test was skipped, ignored or filtered
      # out, and the verifier writes every test binary's counts to the job summary
      # and to test-counts.json, which is kept below as the record that they ran.
      - name: Verify
        run: >
          cargo run -p capsulet-xtask --locked --
          verify --gate postgres --gate migrations --gate chaos

      - name: Keep test counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-test-counts
          path: .capsulet/verify/*/test-counts.json
          if-no-files-found: error

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate dashboard

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate helm

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate compose

  dashboard-e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The gate installs the browser itself; the system libraries it needs on
      # Linux take root, which only this step has.
      - name: Install Playwright's browser and its system libraries
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate dashboard-e2e

      # The gate log carries the stack's service logs when anything failed. The
      # stack, and every credential in it, is gone by the time this runs.
      - name: Upload the gate log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-e2e-log
          path: .capsulet/verify/*/dashboard-e2e.log
          if-no-files-found: ignore

  # Every component's image, built from the plan release.toml defines, with
  # its labels and non-root user checked, then removed. The Rust targets share
  # one build stage, so the workspace compiles once for all five.
  containers:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate containers
