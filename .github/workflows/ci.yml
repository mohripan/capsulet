name: CI

# Every job here calls `capsulet-xtask verify --gate ...`, never a hand-rolled
# command. What passes or fails is decided by repository code that a developer
# runs identically on their own machine; this file only schedules the work and
# provides the services it needs. A workflow that reimplements a check is a
# second definition of "green" that drifts from the first.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  rust:
    name: Rust and IR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify
        run: >
          cargo run -p capsulet-xtask --locked --
          verify --gate verifier --gate format --gate lint --gate unit --gate ir
          --gate replay

  contracts:
    name: Product contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Node 24 or newer: claims-evidence reads which file each dashboard test is
      # in from Node's junit reporter, which only writes it from Node 24.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Verify
        run: >
          cargo run -p capsulet-xtask --locked --
          verify --gate claims --gate api-contracts --gate authorization --gate sdk
          --gate claims-evidence

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    # No service container: the gate provisions its own isolated database and
    # tears it down, so the same command runs here and on a laptop. A service
    # container would be a second, differently configured database that only CI
    # ever sees.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # These gates fail when any database test was skipped, ignored or filtered
      # out, and the verifier writes every test binary's counts to the job summary
      # and to test-counts.json, which is kept below as the record that they ran.
      - name: Verify
        run: >
          cargo run -p capsulet-xtask --locked --
          verify --gate postgres --gate migrations --gate chaos

      - name: Keep test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-counts
          path: .capsulet/verify/*/test-counts.json
          if-no-files-found: error

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate dashboard

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate helm

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate compose

  dashboard-e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The gate installs the browser itself; the system libraries it needs on
      # Linux take root, which only this step has.
      - name: Install Playwright's browser and its system libraries
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify
        run: cargo run -p capsulet-xtask --locked -- verify --gate dashboard-e2e

      # The gate log carries the stack's service logs when anything failed. The
      # stack, and every credential in it, is gone by the time this runs.
      - name: Upload the gate log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e-log
          path: .capsulet/verify/*/dashboard-e2e.log
          if-no-files-found: ignore

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: capsulet-api
            dockerfile: crates/Dockerfile
            build-args: |
              PACKAGE=capsulet-api
              BIN=capsulet-api
          - image: capsulet-worker
            dockerfile: crates/Dockerfile
            build-args: |
              PACKAGE=capsulet-worker
              BIN=capsulet-worker
          - image: capsulet-scheduler
            dockerfile: crates/Dockerfile
            build-args: |
              PACKAGE=capsulet-scheduler
              BIN=capsulet-scheduler
          - image: capsulet-graph-worker
            dockerfile: crates/Dockerfile
            build-args: |
              PACKAGE=capsulet-graph-worker
              BIN=capsulet-graph-worker
          - image: capsulet-evaluator
            dockerfile: crates/Dockerfile
            build-args: |
              PACKAGE=capsulet-evaluator
              BIN=capsulet-evaluator
          - image: capsulet-dashboard
            dockerfile: Dockerfile.dashboard
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: ${{ matrix.image }}:ci
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
