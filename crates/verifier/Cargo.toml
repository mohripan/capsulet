[package]
name = "capsulet-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The verifier protocol: what a validator receives and returns, how it is run, and how its result enters a certificate."

# A validator the tests run as a real process. It decides each obligation by the
# first word of its statement, so a test can ask for every way a validator can
# behave, including the ways it can misbehave.
[[bin]]
name = "fixture-validator"
path = "src/bin/fixture-validator.rs"
test = false
doc = false

# Tests that run real containers, so they need Docker. The `verifier-isolation`
# gate enables this and requires every one of them to run; the `unit` gate,
# which has no Docker, does not build them.
[features]
container-tests = []

[[test]]
name = "isolation"
path = "tests/isolation.rs"
required-features = ["container-tests"]

[dependencies]
capsulet-ir = { path = "../ir" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true

[lints]
workspace = true
