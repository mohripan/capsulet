[package]
name = "capsulet-ir"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure verified-computation IR: canonical encoding, content digests, and schema versions."

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# Tests only: the library itself carries no JSON codec, because the canonical
# encoding is the one that matters. A round trip through serde is how the
# deserialization-time checks get exercised.
serde_json.workspace = true

[lints]
workspace = true
