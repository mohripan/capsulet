[package]
name = "capsulet-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Offline certificate replay. Reads a bundle, reaches its own verdict, and reaches it without a network."

# Deliberately minimal. This binary exists so that "replay needs nothing but the
# bundle" is a fact about its dependency closure rather than a promise in a
# document; `tests/cli.rs` fails if a database, HTTP, async-runtime, or model
# crate ever appears here.
[[bin]]
name = "capsulet-replay"
path = "src/main.rs"

[dependencies]
capsulet-ir = { path = "../ir" }
capsulet-kernel = { path = "../kernel" }
# The pure fold, for reading a run bundle's log again. No store, no clock, no I/O.
capsulet-runtime = { path = "../runtime" }
serde_json.workspace = true

[lints]
workspace = true
