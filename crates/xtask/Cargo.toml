[package]
name = "capsulet-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
ctrlc = "3"
# The stack fixture seeds through the API, and its secrets need a real source of randomness.
getrandom = "0.4"
reqwest = { workspace = true, features = ["blocking"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# The release manifest records each artifact's SHA-256.
sha2.workspace = true
# release.toml and the Cargo, Python and lock manifests it is checked against.
toml.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
