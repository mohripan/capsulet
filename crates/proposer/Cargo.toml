[package]
name = "capsulet-proposer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Untrusted proposers that emit kernel derivations, including a local Ollama adapter."

[lib]
path = "src/lib.rs"

[dependencies]
capsulet-core = { path = "../core" }
capsulet-kernel = { path = "../kernel" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
utoipa = { workspace = true, optional = true }

[features]
# The JSON schema of what a model emitted, for the API's OpenAPI document. Off by
# default, like the kernel's.
openapi = ["dep:utoipa"]

[lints]
workspace = true
