[package]
name = "capsulet-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Deterministic correctness kernel that decides proposals and issues certificates."

[lib]
path = "src/lib.rs"

[dependencies]
capsulet-core = { path = "../core" }
capsulet-ir = { path = "../ir" }
icu_casemap.workspace = true
icu_properties.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
utoipa = { workspace = true, optional = true }

[features]
# The JSON schemas of the types the kernel puts on the wire, for the API's
# OpenAPI document. Off by default: the kernel itself depends on no HTTP schema
# library, and only the API turns this on.
openapi = ["dep:utoipa"]

[lints]
workspace = true
