[package]
name = "capsulet-graph-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Durable worker that advances verified-computation IR runs."

[lib]
path = "src/lib.rs"

[[bin]]
name = "capsulet-graph-worker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
capsulet-application = { path = "../application" }
capsulet-core = { path = "../core" }
capsulet-ir = { path = "../ir" }
capsulet-kernel = { path = "../kernel" }
capsulet-pack = { path = "../pack" }
capsulet-verifier = { path = "../verifier" }
capsulet-observability = { version = "0.1.0", path = "../observability" }
capsulet-postgres = { path = "../postgres" }
capsulet-runtime = { path = "../runtime" }
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
# The M4 gate's test: it needs a stack and a container runtime, so only the
# `m4` gate builds it, on a stack of its own.
stack-tests = []

[[test]]
name = "m4_gate"
required-features = ["stack-tests"]

[dev-dependencies]
capsulet-api = { path = "../api", features = ["contract-conformance"] }
capsulet-proposer = { path = "../proposer" }
tempfile = "3"
capsulet-observability = { path = "../observability", features = ["testing"] }
capsulet-storage = { path = "../storage" }
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
