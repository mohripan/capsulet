[package]
name = "capsulet-graph-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Durable worker that advances verified-computation IR runs."

[lib]
path = "src/lib.rs"

[[bin]]
name = "capsulet-graph-worker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
capsulet-application = { path = "../application" }
capsulet-core = { path = "../core" }
capsulet-ir = { path = "../ir" }
capsulet-observability = { version = "0.1.0", path = "../observability" }
capsulet-postgres = { path = "../postgres" }
capsulet-runtime = { path = "../runtime" }
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
capsulet-api = { path = "../api", features = ["contract-conformance"] }
capsulet-kernel = { path = "../kernel" }
capsulet-observability = { path = "../observability", features = ["testing"] }
capsulet-storage = { path = "../storage" }
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
