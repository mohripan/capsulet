{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "capsulet.fullname" . }}-migrate
  labels:
    {{- include "capsulet.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- /* A Job spec.template is immutable, so this must be recreated per release instead of patched.
           post-install (not pre-install) so the bundled PostgreSQL exists on a fresh install;
           pre-upgrade so the schema is migrated before the new images roll out. */}}
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    {{- /* Deleted once it succeeds, so `helm uninstall` leaves nothing behind; a
           failed run is kept for its logs until the next release replaces it. */}}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "capsulet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "capsulet.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "capsulet.componentImage" (list . .Values.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "capsulet.fullname" . }}-config
          env:
            - name: CAPSULET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "capsulet.databaseSecretName" . }}
                  key: {{ include "capsulet.databaseSecretKey" . }}
            - name: CAPSULET_MIGRATE_ONLY
              value: "true"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
