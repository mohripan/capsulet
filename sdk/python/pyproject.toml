# capsulet-claims: CAP-SDK-001
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capsulet"
# Read from src/capsulet/_version.py, which release.toml governs.
dynamic = ["version"]
description = "Experimental Python authoring SDK for Capsulet compatibility workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Capsulet contributors" }]
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[tool.hatch.build.targets.wheel]
packages = ["src/capsulet"]

[tool.hatch.version]
path = "src/capsulet/_version.py"
