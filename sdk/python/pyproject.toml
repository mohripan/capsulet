[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capsulet"
version = "0.1.0"
description = "Experimental Python authoring SDK for Capsulet compatibility workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Capsulet contributors" }]
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[tool.hatch.build.targets.wheel]
packages = ["src/capsulet"]
