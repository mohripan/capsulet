# Every secret below comes from an environment file generated for one stack.
# None is checked in. Start a stack with its own secrets and seeded identities:
#
#   cargo run -p capsulet-xtask -- stack up
#
# and remove it, volumes and secrets included, with `stack down`. The verifier's
# `compose` and `dashboard-e2e` gates run the same way, each under a project
# name, ports and secrets of its own. See docs/development/test-identities.md.
#
# Host ports bind to 127.0.0.1 only, and each can be moved with its variable.
# Dependency images are pinned by digest, so a stack built today runs what one
# built tomorrow runs.

x-database-url: &database-url postgres://capsulet:${CAPSULET_POSTGRES_PASSWORD:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}@postgres:5432/capsulet

# Every image built here is labelled with the release identity from
# release.toml and the revision it was built from, which `stack up` writes to
# the stack's environment file alongside its secrets.
x-image-identity: &image-identity
  VERSION: ${CAPSULET_VERSION:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
  REVISION: ${CAPSULET_REVISION:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
  CREATED: ${CAPSULET_CREATED:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
  SOURCE: ${CAPSULET_SOURCE:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}

# Artifacts and logs go through the S3 adapter to the bundled SeaweedFS, the
# same path a deployment against any S3-compatible store takes.
x-object-storage: &object-storage
  CAPSULET_OBJECT_STORAGE_MODE: s3
  CAPSULET_OBJECT_STORAGE_BUCKET: capsulet-artifacts
  CAPSULET_OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
  CAPSULET_OBJECT_STORAGE_REGION: us-east-1
  CAPSULET_OBJECT_STORAGE_PATH_STYLE: "true"
  CAPSULET_OBJECT_STORAGE_ACCESS_KEY_ID: capsulet
  CAPSULET_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${CAPSULET_OBJECT_STORE_SECRET_KEY:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: capsulet
      POSTGRES_USER: capsulet
      POSTGRES_PASSWORD: ${CAPSULET_POSTGRES_PASSWORD:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
    ports:
      - "127.0.0.1:${CAPSULET_POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsulet -d capsulet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - capsulet-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    # Master, volume server, filer and S3 gateway in one process, which creates
    # the bucket on start. WebDAV, the admin UI, the Iceberg and Lance endpoints
    # and the usage telemetry are switched off.
    command:
      - mini
      - -dir=/data
      - -bucket=capsulet-artifacts
      - -s3.port=8333
      - -master.telemetry=false
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # This one key is admitted; anonymous requests are refused.
      AWS_ACCESS_KEY_ID: capsulet
      AWS_SECRET_ACCESS_KEY: ${CAPSULET_OBJECT_STORE_SECRET_KEY:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      # Without these, anything on the network could write to the volume server
      # or the filer directly, or create S3 identities through the filer's IAM
      # service, around the key above.
      WEED_JWT_SIGNING_KEY: ${CAPSULET_OBJECT_STORE_VOLUME_SIGNING_KEY:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      WEED_JWT_FILER_SIGNING_KEY: ${CAPSULET_OBJECT_STORE_FILER_SIGNING_KEY:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
    ports:
      - "127.0.0.1:${CAPSULET_OBJECT_STORE_PORT:-8333}:8333"
    volumes:
      - capsulet-object-data:/data
    healthcheck:
      # Healthy once the bucket exists, which the S3 gateway answering does
      # not prove yet. The filer port is not published.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/buckets/capsulet-artifacts/"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  smtp:
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    ports:
      - "127.0.0.1:${CAPSULET_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${CAPSULET_MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: capsulet-keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CAPSULET_KEYCLOAK_ADMIN_PASSWORD:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_URL: http://localhost:${CAPSULET_KEYCLOAK_PORT:-18080}
      # Read by the realm import, which fills in its placeholders from these.
      CAPSULET_KEYCLOAK_USER_PASSWORD: ${CAPSULET_KEYCLOAK_USER_PASSWORD:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      CAPSULET_DASHBOARD_PORT: ${CAPSULET_DASHBOARD_PORT:-3000}
    ports:
      - "127.0.0.1:${CAPSULET_KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./deploy/keycloak/capsulet-realm.json:/opt/keycloak/data/import/capsulet-realm.json:ro
    healthcheck:
      # The image has no curl or wget; bash can still speak HTTP to the
      # management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  api:
    init: true
    build:
      context: .
      dockerfile: crates/Dockerfile
      target: api
      args: *image-identity
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      CAPSULET_DATABASE_URL: *database-url
      CAPSULET_API_ADDR: 0.0.0.0:8080
      CAPSULET_SEED_EXAMPLES: "true"
      CAPSULET_API_TOKENS: ${CAPSULET_API_TOKENS:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      CAPSULET_OIDC_ISSUER: http://localhost:${CAPSULET_KEYCLOAK_PORT:-18080}/realms/capsulet
      CAPSULET_OIDC_AUDIENCE: capsulet-dashboard
      CAPSULET_OIDC_JWKS_URL: http://keycloak:8080/realms/capsulet/protocol/openid-connect/certs
      CAPSULET_WEBHOOK_SECRETS: ${CAPSULET_WEBHOOK_SECRETS:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      CAPSULET_EXECUTION_POOLS: mini,large
      <<: *object-storage
      # The proposer runs outside the stack: correctness does not depend on it,
      # so it stays a replaceable box the kernel checks rather than a service.
      CAPSULET_OLLAMA_URL: http://host.docker.internal:11434
      CAPSULET_OLLAMA_MODEL: qwen2.5:1.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CAPSULET_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  worker:
    init: true
    build:
      context: .
      dockerfile: crates/Dockerfile
      target: worker
      args: *image-identity
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      CAPSULET_DATABASE_URL: *database-url
      CAPSULET_WORKER_ID: worker-compose
      CAPSULET_WORKER_LOOP: "true"
      CAPSULET_WORKER_POLL_SECONDS: "2"
      CAPSULET_WORKER_LEASE_SECONDS: "60"
      CAPSULET_WORKER_HEALTH_ADDR: 0.0.0.0:8081
      CAPSULET_RUNNER_MODE: process
      CAPSULET_STUB_RUNNER_LOGS: |
        Docker Compose stub runner completed the job.
        Capsulet captured this log preview for local smoke testing.
      CAPSULET_STUB_ARTIFACT_TEXT: "Generated by the Docker Compose stub runner."
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_FROM: capsulet@example.local
      <<: *object-storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  scheduler:
    init: true
    build:
      context: .
      dockerfile: crates/Dockerfile
      target: scheduler
      args: *image-identity
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      CAPSULET_DATABASE_URL: *database-url
      CAPSULET_SCHEDULER_LOOP: "true"
      CAPSULET_SCHEDULER_POLL_SECONDS: "3"
      CAPSULET_SCHEDULER_HEALTH_ADDR: 0.0.0.0:8082
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  graph-worker:
    init: true
    build:
      context: .
      dockerfile: crates/Dockerfile
      target: graph-worker
      args: *image-identity
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      CAPSULET_DATABASE_URL: *database-url
      CAPSULET_GRAPH_WORKER_ID: graph-worker-compose
      CAPSULET_GRAPH_WORKER_POLL_SECONDS: "1"
      CAPSULET_GRAPH_WORKER_LEASE_SECONDS: "60"
      CAPSULET_GRAPH_WORKER_HEALTH_ADDR: 0.0.0.0:8084
      # Model nodes use this. Without a reachable model they fail and say so, and
      # everything deterministic still runs.
      CAPSULET_OLLAMA_URL: ${CAPSULET_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  evaluator:
    init: true
    build:
      context: .
      dockerfile: crates/Dockerfile
      target: evaluator
      args: *image-identity
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      CAPSULET_DATABASE_URL: *database-url
      CAPSULET_EVALUATOR_ID: evaluator-compose
      CAPSULET_EVALUATOR_POLL_SECONDS: "2"
      CAPSULET_EVALUATOR_HEALTH_ADDR: 0.0.0.0:8083
      CAPSULET_SQL_CONNECTIONS: '{"control":"postgres://capsulet:${CAPSULET_POSTGRES_PASSWORD}@postgres:5432/capsulet"}'
      <<: *object-storage
      CAPSULET_RETENTION_DAYS: "30"
      CAPSULET_AUDIT_RETENTION_DAYS: "365"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args: *image-identity
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      CAPSULET_DASHBOARD_API_URL: http://api:8080
      CAPSULET_DASHBOARD_PUBLIC_URL: http://127.0.0.1:${CAPSULET_DASHBOARD_PORT:-3000}
      CAPSULET_DASHBOARD_OIDC_PUBLIC_ISSUER: http://localhost:${CAPSULET_KEYCLOAK_PORT:-18080}/realms/capsulet
      CAPSULET_DASHBOARD_OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/capsulet
      CAPSULET_DASHBOARD_OIDC_CLIENT_ID: capsulet-dashboard
      CAPSULET_TEMP_ADMIN_USERNAME: ${CAPSULET_DASHBOARD_ADMIN_USERNAME:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      CAPSULET_TEMP_ADMIN_PASSWORD: ${CAPSULET_DASHBOARD_ADMIN_PASSWORD:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      CAPSULET_TEMP_ADMIN_API_TOKEN: ${CAPSULET_DASHBOARD_ADMIN_TOKEN:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
    ports:
      - "127.0.0.1:${CAPSULET_DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      evaluator:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${CAPSULET_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus-rules-compose.yml:/etc/prometheus/rules/capsulet.yaml:ro
      - capsulet-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: capsulet-grafana-admin
      GF_SECURITY_ADMIN_PASSWORD: ${CAPSULET_GRAFANA_ADMIN_PASSWORD:?generate the stack secrets with `cargo run -p capsulet-xtask -- stack up`}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${CAPSULET_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/capsulet.yml:ro
      - ./deploy/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/capsulet.yml:ro
      - ./deploy/observability/grafana-dashboard.json:/var/lib/grafana/dashboards/capsulet.json:ro
      - capsulet-grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  capsulet-postgres-data:
  capsulet-object-data:
  capsulet-prometheus-data:
  capsulet-grafana-data:
