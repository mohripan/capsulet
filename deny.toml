[advisories]
# Kept in step with .cargo/audit.toml by
# crates/xtask/tests/verify_cli.rs, which also fails the build when an entry
# here is not documented in docs/contracts/security-exceptions.md with an owner
# and an unexpired review date. Two tools, one set of exceptions.
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
